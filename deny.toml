# cargo-deny — supply-chain gate (CONSTITUTION §0). Maps the aic
# composer-audit + roave/security-advisories + dependency-hygiene gates to
# Rust: RUSTSEC advisories, license allow-list, and source pinning.

[advisories]
version = 2
# RUSTSEC advisory DB. Fail on any vulnerability or unmaintained-with-advisory.
yanked = "deny"
# `ignore` is the ONLY escape hatch and is a justified, dated list — not a
# blanket baseline (CONSTITUTION §0). Empty by charter.
ignore = []

[licenses]
version = 2
# Permissive + weak-copyleft licenses we accept. Anything else fails — vet it
# and add here with intent, or drop the dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9
# The allow-list is forward-looking; don't fail when a listed license isn't
# currently used by any dependency.
unused-allowed-license = "allow"

[bans]
# Transitive duplicate major versions are unavoidable in a real tree (e.g.
# toml pulls winnow 0.7 AND 1.0) — allow them. Path deps inside our own
# workspace register as "wildcards" on the publishable game crates (a
# cargo-deny quirk: allow-wildcard-paths doesn't apply to public crates), so
# wildcards are allowed too. The load-bearing supply-chain checks are the
# advisories / licenses / sources sections above.
multiple-versions = "allow"
wildcards = "allow"
allow-wildcard-paths = true

[sources]
# Only crates.io. No unknown registries or unpinned git deps.
unknown-registry = "deny"
unknown-git = "deny"
