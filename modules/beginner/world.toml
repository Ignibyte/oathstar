# Regions, subregions, and sample entity/item content for the beginner module.
# Rooms (rooms.toml) reference regions/subregions by id; these define them, and
# the core validator (WorldDefinition::validate) rejects any dangling reference.

[[regions]]
id = "hollowmere"
name = "Hollowmere"

[[regions]]
id = "ashen_road"
name = "The Ashen Road"

[[regions]]
id = "old_bell_tower"
name = "The Old Bell Tower"

[[subregions]]
id = "town"
name = "Hollowmere Town"
region = "hollowmere"

[[subregions]]
id = "wall"
name = "Town Wall"
region = "hollowmere"

[[subregions]]
id = "wilds"
name = "Roadside Wilds"
region = "ashen_road"

[[subregions]]
id = "tower"
name = "Bell Tower"
region = "old_bell_tower"

[[subregions]]
id = "boss"
name = "Bell Eater's Roost"
region = "old_bell_tower"

# A sample actor (NPC) that owns a sample item — exercises the entity model and
# the entity→item ownership reference. Placement into a room is a future ticket.
[[entities]]
id = "mara"
name = "Mara Candlekeep"
description = "A severe woman with wax on her sleeves and a ledger chained to her belt."
aliases = ["mara", "shopkeeper", "candlekeep"]
kind = "actor"
roles = ["talkable", "oath_giver", "shopkeeper"]
# Ticket #35 adds the starter gear to her counter: a blade and a waxed coat
# (a candle-keeper waterproofs leather anyway — W1 re-homes stock properly).
inventory = ["candle", "rust_edge_blade", "waxed_coat"]

# Mara's authored dialogue (ticket #19). `greeting` is the default reply; the
# `oath` block is spoken because Mara issues the Hollow Bell oath (oath.issuer_id
# = "mara"), selected by the player's oath state. Talking while unsworn offers the
# oath, which `swear` then requires.
[entities.dialogue]
greeting = "Mara sets down her ledger. \"Wax and wicks, oathbearer. Mind the puddles.\""

[entities.dialogue.oath]
offer = "Mara's jaw tightens. \"You hear how quiet the square is? The Bell-Eater stole the bell's clapper, and Hollowmere hasn't rung since — no call to prayer, no warning, no welcome. Someone has to swear to set it right. Will you?\" (You could now swear the oath of the Hollow Bell.)"
sworn = "Mara nods toward the empty bell-frame. \"You've sworn it. The Bell-Eater roosts atop the old tower — north, ever north. Bring back our voice.\""
fulfilled = "Mara almost smiles. \"The bell rang at dawn. You kept your word, oathbearer — Hollowmere won't forget it.\""

[[items]]
id = "candle"
name = "Black Candle"
description = "A squat black candle that smells faintly of brine and old promises."
aliases = ["candle", "black candle"]
kind = "light"
# Ticket #34: Mara's stock — the vertical slice's demo purchase. The played
# loop funds it exactly: stray victory (4) + fang sale (3) + wax stub sale (1).
value = 8

# A loose item lying in Hollowmere Square — the first ground-placed, takeable
# thing (ticket #18 `take` demo). Flavor-only: no mechanics, no oath link.
[[items]]
id = "wax_stub"
name = "Wax Stub"
description = "A cold stub of black wax, dropped and forgotten on the wet cobbles."
aliases = ["wax", "stub", "wax stub"]
kind = "trinket"
# Ticket #34: pocket change — sells for 1 coin.
value = 2

# The starter weapon (ticket #35) — Mara's counter, 6 coins. Attack 2 lifts
# the basic strike to 6 and the power strike to 8: the Bell-Eater (12 hp)
# falls in two basic blows instead of three, the visible gear payoff.
[[items]]
id = "rust_edge_blade"
name = "Rust-Edge Blade"
description = "A short blade freckled with rust. The edge underneath still means it."
aliases = ["blade", "sword", "rust-edge", "rust-edge blade"]
kind = "weapon"
value = 6
equipment = { slot = "weapon", attack = 2 }

# The starter armor (ticket #35) — Mara's counter, 4 coins. Defense 1 turns
# one point of every hit aside: the stray's bite lands 2, the boss's 3.
[[items]]
id = "waxed_coat"
name = "Waxed Leather Coat"
description = "A drover's coat stiff with candle-wax. Rain and teeth both slide off it."
aliases = ["coat", "leather coat", "waxed coat"]
kind = "armor"
value = 4
equipment = { slot = "armor", defense = 1 }

# The stolen bell clapper — the boss's hoarded prize and the oath's objective.
[[items]]
id = "bell_clapper"
name = "Bell Clapper"
description = "The bell's stolen iron tongue, heavy with old promises."
aliases = ["clapper", "bell clapper"]
kind = "quest"
flags = ["oath"]

# The Ashen Stray's drop (ticket #26) — the beginner reward-loop demo: defeat
# the stray, watch the fang fall, take it. Flavor trophy, no mechanics.
[[items]]
id = "stray_fang"
name = "Cracked Fang"
description = "A yellowed hound's fang, split down the middle. Proof of a road fight won."
aliases = ["fang", "cracked fang"]
kind = "trophy"
# Ticket #34: a sellable trophy — 3 coins at Mara's counter.
value = 6
# Ticket #35: the first drop is also the first weapon — equip it for +1
# strike damage, or sell it toward the blade. The choice IS the tutorial.
equipment = { slot = "weapon", attack = 1 }

# The boss actor, placed in bell_eater_roost (see rooms.toml). The "boss" role is
# how the engine's `confront` command finds the boss in the current room.
[[entities]]
id = "bell_eater"
name = "The Bell-Eater"
description = "A copper-throated horror that swallowed Hollowmere's bell-voice."
aliases = ["bell-eater", "bell eater", "eater"]
kind = "actor"
roles = ["boss", "combatant"]
inventory = ["bell_clapper"]
# Ticket #29: confront (sworn) starts a real pulse-loop fight against these
# stats. Winnable-but-dangerous vs the player's 20 hp / strike 4: three rounds
# to fell it, two 4-damage returns absorbed bare-handed — guard and power
# strike visibly matter, and a player arriving hurt can genuinely lose.
# Victory drops the clapper (inventory) and pays 25 XP (5x the stray's fang
# fight — a milestone reward). Ticket #34 adds the 25-coin purse — the
# milestone faucet that funds post-oath shopping. Stats stay undisclosed: the
# boss reads as "unknown" in the entity detail view (intended menace).
combat = { health = 12, attack = 4, xp = 25, coins = 25 }

# A hungry road-scavenger that haunts the Ashen Road — the beginner combat
# encounter (ticket #22). `hostile` makes it attackable (its combat profile is
# required by the hostile contract); `combatant` marks it as a fighter. Winnable
# by design: 9 health falls to three player strikes (4 each) and its 3-damage
# bite leaves the player well above zero. It does not gate the oath/boss path.
[[entities]]
id = "ashen_stray"
name = "Ashen Stray"
description = "A scrawny, ash-matted hound with too many teeth and a low, wet growl."
aliases = ["stray", "hound", "dog", "ashen stray"]
kind = "actor"
roles = ["combatant", "hostile"]
# Ticket #26: the beginner reward-loop demo — defeating the stray awards 5 XP
# and drops its fang into the road.
inventory = ["stray_fang"]
# Ticket #23: this stray discloses its combat stats to nearby inspection (the
# visible-stats demo). A combatant without this flag (e.g. the Bell-Eater) renders
# as "unknown" in the entity detail view. Ticket #26 adds the authored XP reward;
# #34 adds the 4-coin reward that anchors the candle loop (4 + fang 3 + stub 1 = 8).
combat = { health = 9, attack = 3, disclose_stats = true, xp = 5, coins = 4 }

# The beginner oath, offered by the module (module.toml `oath_id`). Ticket #29:
# fulfillment is RECOVERING THE CLAPPER — defeat the Bell-Eater (confront), the
# clapper drops, and taking it while sworn fulfills the oath. The oath text has
# always said so; now the mechanics agree.
[[oaths]]
id = "hollow_bell"
title = "The Hollow Bell"
description = "Recover the bell's stolen clapper and make Hollowmere ring again."
# Ticket #19: Mara offers this oath (talk to her to be offered it before swearing);
# `source` records the region origin for future oath-giver UI and faction effects.
issuer_id = "mara"
source = "hollowmere"
# Ticket #29: the recoverable objective — taking this item while sworn fulfills.
objective_item_id = "bell_clapper"

# Ticket #27: fulfilling the oath rings the bell. The world-scoped alarm is
# heard wherever the player stands (the played demo line at the roost); the
# hollowmere notice is scoped to the town region, so the player standing in
# old_bell_tower provably does NOT receive it — the in-play both-arms demo.
[[oaths.fulfillment_announcements]]
scope = "world"
severity = "alarm"
text = "The bell of Hollowmere rings again. Its voice rolls out over every road and roof."

[[oaths.fulfillment_announcements]]
scope = { region = "hollowmere" }
severity = "notice"
text = "Hollowmere's streets fill with voices as the bell's song returns."
