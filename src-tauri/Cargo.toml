# src-tauri is its own workspace root: it owns a separate Cargo.lock and builds
# with the `tauri` toolchain, and is deliberately NOT a member of the root
# workspace (crates/oathstar-*). This empty table declares that explicitly so
# `cargo <cmd> --manifest-path src-tauri/Cargo.toml` works standalone — the
# bin/gate.sh "tauri shell" gate (gate:14) — instead of erroring with
# "current package believes it's in a workspace when it's not". (ticket #4)
[workspace]

[package]
name = "oathstar"
version = "0.1.0"
description = "A single-player MUD-inspired roleplaying game."
authors = ["Oathstar"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "oathstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# serde/serde_json are not yet referenced by the stock shell but are required
# the moment a `#[tauri::command]` lands (IPC arg/return serialization). Kept +
# justified-ignored rather than churned. Remove the ignore once a command uses them.
[package.metadata.cargo-machete]
ignored = ["serde", "serde_json"]
