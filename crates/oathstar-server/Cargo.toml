[package]
name = "oathstar-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
futures-core.workspace = true
oathstar-content = { path = "../oathstar-content" }
oathstar-core = { path = "../oathstar-core" }
oathstar-datastar = { path = "../oathstar-datastar" }
oathstar-protocol = { path = "../oathstar-protocol" }
oathstar-storage = { path = "../oathstar-storage" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# test-util unlocks tokio's paused virtual clock (start_paused), so the real
# 1s tick loop drives deterministic combat-pulse tests with no real waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
